# Separate example: no local model service. Run only when explicitly selected.
# Requires outbound DNS and verified HTTPS to api.openai.com through host egress policy.
services:
  planner:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ${RESEARCH_PLANNER_ENV_FILE:?Set a protected OpenAI planner env file}
    environment:
      RESEARCH_PLANNER_MODEL_PROVIDER: openai
      RESEARCH_PLANNER_MODEL_BASE_URL: https://api.openai.com/v1
    ports:
      - '127.0.0.1:8090:8090'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
